<meta name="theme-color" content="#b87571">
<link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f6f7f3;--card:#fff;--ink:#1b2a29;--mute:#667572;--line:#dde2dc;--accent:#0f5c57;
--free:#2f8f5b;--busy:#2f6db5;--clean:#c28a14;--fix:#b4493d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121917;--card:#1b2523;--ink:#e8efec;--mute:#93a39f;--line:#2e3b38;--accent:#5cc2b8;--free:#52c283;--busy:#6aa3e8;--clean:#e2b23f;--fix:#e5766a}}
:root[data-theme="dark"]{--bg:#121917;--card:#1b2523;--ink:#e8efec;--mute:#93a39f;--line:#2e3b38;--accent:#5cc2b8;--free:#52c283;--busy:#6aa3e8;--clean:#e2b23f;--fix:#e5766a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Kantumruy Pro","Noto Sans Khmer","Khmer OS",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6}
main{max-width:1000px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{margin:0;font-size:1.7rem;font-weight:700}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:64px;height:64px;border-radius:50%;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.25)}
h2{font-size:1.2rem;margin:22px 0 10px;display:flex;gap:10px;align-items:center}
h2 small{color:var(--mute);font-weight:400;font-size:.9rem}
.sub{color:var(--mute);margin:0}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;cursor:pointer}
.btn{background:var(--accent);color:var(--bg);border:0;border-radius:8px;padding:9px 16px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--fix);border:1px solid var(--fix)}
.btn.sm{padding:5px 10px;font-size:.85rem}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.clock{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--accent);color:var(--bg);border-radius:12px;padding:14px 20px;margin-bottom:14px}
.time{font-size:clamp(2.2rem,9vw,3.4rem);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.date{font-size:1.1rem}
.bar{display:flex;gap:22px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:14px}
.bar div{display:flex;flex-direction:column}
.bar b{font-size:1.4rem}
.bar span{color:var(--mute);font-size:.85rem}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 16px;margin-bottom:14px}
summary{cursor:pointer;font-weight:600}
.prices{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 14px;display:flex;gap:8px;align-items:center}
.chip[aria-pressed="true"]{border-color:var(--ink);font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.room{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.num{font-size:1.15rem;font-weight:700}
.st{font-weight:600;color:var(--c);font-size:.85rem}
.type{color:var(--mute);font-size:.85rem}
.price{font-weight:600}
.guest{font-size:.95rem}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.clk{font-variant-numeric:tabular-nums}
.empty{grid-column:1/-1;color:var(--mute);padding:18px;text-align:center;border:1px dashed var(--line);border-radius:10px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:min(460px,94vw);padding:0;overflow:hidden}
dialog[open]{display:flex;flex-direction:column;max-height:92vh}
dialog.wide{width:min(920px,96vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px 12px 20px;border-bottom:1px solid var(--line);flex:none}
.dh h2{margin:0}
.db{padding:16px 20px 20px;overflow:auto}
.x{flex:none;width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:1.3rem;line-height:1}
.btn.main{flex:1;min-height:40px;padding:8px 14px}
.btn.out{background:var(--fix);color:#fff}
.tw{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:600;white-space:nowrap}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:92vw;text-align:center}
#toast.show{opacity:1}
label{display:block;font-size:.85rem;color:var(--mute);margin-bottom:10px}
input,select,textarea{display:block;width:100%;margin-top:3px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nowrow{display:flex;gap:12px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.nowrow .clk{font-size:1.2rem;font-weight:700}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
.actions .spacer{margin-right:auto}
.est{font-weight:600;min-height:1.4em}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cd{font-weight:700;font-size:1.2rem;font-variant-numeric:tabular-nums;color:var(--busy);line-height:1.3}
.cd.up{color:var(--fix);animation:pulse 1s ease-in-out infinite}
.room.up{outline:2px solid var(--fix);outline-offset:-2px}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.cd.up{animation:none}}
.tag{align-self:flex-start;font-size:.8rem;font-weight:600;border:1px solid var(--busy);color:var(--busy);border-radius:999px;padding:0 10px}
.tot{font-size:1.25rem;font-weight:700}
.amt{font-weight:700;color:var(--accent);font-size:1.05rem}
.arow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
dialog.alert{border:3px solid var(--fix)}
.hint{color:var(--mute);font-size:.8rem;margin:-6px 0 10px}
.pay{font-size:.85rem;font-weight:600;color:var(--free)}.pay.due{color:var(--clean)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.cal .wd{text-align:center;color:var(--mute);font-size:.8rem;padding:2px 0}
.dy{min-height:60px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:1px;font-size:.9rem;min-width:0}
.dy.off{opacity:.5}.dy.has{border-color:var(--accent)}
.dy.today{box-shadow:inset 0 0 0 2px var(--clean)}
.dy.sel{background:var(--accent);color:var(--bg);border-color:var(--accent);opacity:1}
.dy small{font-size:.7rem;opacity:.9}
.dy .n{background:var(--busy);color:#fff;border-radius:999px;padding:0 7px;font-size:.75rem;font-weight:600}
.dy.sel .n{background:var(--bg);color:var(--accent)}
.dg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:10px}
.dc{border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;padding:10px 12px;background:var(--bg);display:flex;flex-direction:column;gap:2px}
.calnav{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.calnav .ttl{font-weight:700;font-size:1.1rem}
@media (max-width:520px){.dy{min-height:52px;font-size:.8rem}.dy small{display:none}}
.ptab{width:100%;border-collapse:collapse;font-size:.95rem;margin-top:10px}
.ptab th,.ptab td{border:1px solid var(--line);text-align:center;padding:0;vertical-align:middle}
.ptab thead th,.ptab tfoot th{background:var(--bg);padding:8px 10px;color:var(--mute);font-weight:600}
.ptab tbody th{background:var(--bg);color:var(--ink);padding:8px 10px;text-align:left;white-space:nowrap}
.ptab input{margin:0;border:0;border-radius:0;background:transparent;text-align:center;font-weight:700;font-size:1.05rem;padding:12px 4px;min-width:64px;-moz-appearance:textfield}
.ptab input::-webkit-outer-spin-button,.ptab input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.ptab td:focus-within{background:var(--bg);outline:2px solid var(--accent);outline-offset:-2px}
.vo #add,.vo #chg,.vo #qrFile,.vo #qrDel,.vo #clrH,.vo #vbill,.vo #vedit,.vo [data-i18n="qrUp"],.vo #alist .btn{display:none!important}
.ptab input:disabled{opacity:1;color:var(--ink);-webkit-text-fill-color:var(--ink)}
</style>
</head>

function beep(){
  try{if(actx){[0,.25,.5].forEach(d=>{const o=actx.createOscillator(),g=actx.createGain(),st=actx.currentTime+d;o.frequency.value=880;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.0001,st);g.gain.exponentialRampToValueAtTime(.4,st+.02);g.gain.exponentialRampToValueAtTime(.0001,st+.2);o.start(st);o.stop(st+.22)})}}catch(e){}
  try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
}
function renderAlert(ex){
  $("alist").innerHTML=ex.map(r=>`<div class="arow"><div><b>${t("room")} ${esc(r.n)}</b>${r.guest?" · "+esc(r.guest):""}<div class="type">${t("untilT")} ${hm(new Date(endMs(r)))}</div><div class="cd" data-end="${endMs(r)}"></div></div><button type="button" class="btn out sm" data-bill="${r.id}">${t("payOut")}</button></div>`).join("");
}
function checkAlerts(){
  const ex=expired(),dlg=$("adlg");
  if(!ex.length){if(dlg.open)dlg.close();return}
  const sig=ex.map(r=>r.id).join(),was=dlg.open;
  if(sig!==asig||!was){asig=sig;renderAlert(ex)}
  if(!was){dlg.showModal();beep();beepT=setInterval(beep,3000)}
}
$("adlg").addEventListener("cancel",e=>e.preventDefault());
$("adlg").addEventListener("close",()=>{clearInterval(beepT);beepT=null;asig=""});
$("aok").onclick=()=>{ack(expired());$("adlg").close()};
$("alist").onclick=e=>{const b=e.target.closest("[data-bill]");if(!b)return;const r=rooms.find(x=>x.id==b.dataset.bill);if(r){ack([r]);$("adlg").close();openBill(r)}};

const ev=(s,tm)=>`${t("room")} ${s.n}${s.guest?" · "+s.guest:""} · ${tm||"—"}${s.notes?" ("+s.notes+")":""}`;
const fy=d=>d?fmt(d)+" "+d.slice(0,4):"—";
const tot=(a,f)=>a.reduce((x,s)=>x+(+f(s)||0),0);
function calc(){
  const now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const all=stays();
  const map={},slot=k=>map[k]=map[k]||{r:0,p:0,ins:[],outs:[]};let lo=null,hi=null;
  const span=(a,e)=>{if(!lo||a<lo)lo=a;if(!hi||e>hi)hi=e};
  all.filter(s=>s.ci).forEach(s=>{
    const a=pd(s.ci);let e=s.co?pd(s.co):today;
    if(s.co&&e>a)e=new Date(e.getFullYear(),e.getMonth(),e.getDate()-1);
    if(e<a)e=a;
    for(let d=new Date(a),i=0;d<=e&&i<3700;d.setDate(d.getDate()+1),i++){const x=slot(ymd(d));x.r++;x.p+=+s.people||0}
    slot(s.ci).ins.push(s);span(a,e);
  });
  all.filter(s=>s.co).forEach(s=>{slot(s.co).outs.push(s);const c=pd(s.co);span(c,c)});
  const days=[];
  if(lo)for(let d=new Date(lo);d<=hi;d.setDate(d.getDate()+1)){const k=ymd(d);days.push({k,...slot(k)})}
  return{all,days};
}
const dayRow=(d,j)=>[d.k,d.r,d.p,d.ins.length,tot(d.ins,s=>s.people),tot(d.ins,s=>s.amount),d.ins.map(s=>ev(s,s.cit)).join(j),d.outs.map(s=>ev(s,s.cot)).join(j)];
const table=(h,rows)=>`<div class="tw"><table><thead><tr>${h.map(x=>`<th>${esc(x)}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>c!==null&&typeof c=="object"?`<td>${c.html}</td>`:`<td>${esc(c).replace(/\n/g,"<br>")}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
const typeL=s=>s.mode=="hour"?t("hrMode"):t("nightMode");
const durL=s=>s.mode=="hour"?`${s.hrs||hh()} ${t("hr")}`:`${s.ci?nightsB(s):0} ${t("night")}`;
let ht="cal",hY=null,hM=0,hSel="",hq="";
const WS={km:["អា","ច","អ","ព","ព្រ","សុ","ស"],en:["Su","Mo","Tu","We","Th","Fr","Sa"]};
const onDay=(x,D)=>{if(!x.ci)return null;const co=x.co||(x.live?ymd(new Date()):x.ci),last=co<x.ci?x.ci:co;if(D<x.ci||D>last)return null;return D==x.ci?(x.co==D&&!x.live?"io":"in"):(D==co?"out":"stay")};
function stayCard(x){
  const s=x.s,k=x.k,hr=s.mode=="hour",c=k=="io"?"var(--accent)":k=="in"?"var(--free)":k=="out"?"var(--fix)":"var(--busy)",lbl=k=="io"?t("sIn")+" · "+t("sOut"):k=="in"?t("sIn"):k=="out"?t("sOut"):t("sStay"),gd=gdesc(s),a=+s.amount||0;
  return `<div class="dc" style="--c:${c}"><div class="top"><span class="num">${t("room")} ${esc(s.n)}</span><span class="st">${lbl}${s.live?" · "+t("inHouse"):""}</span></div>
  <span class="guest">${esc(s.guest)||"—"} · ${+s.people||0} ${t("ppl")}${gd?` (${esc(gd)})`:""}</span>
  <span class="type">${hr?"⏱ "+t("hrMode")+" · "+(s.hrs||hh())+" "+t("hr"):t("nightMode")+" · "+durL(s)}</span>
  <span class="type">${t("cin")}: ${s.ci?esc(fy(s.ci)+" "+(s.cit||"")):"—"}</span>
  <span class="type">${t("cout")}: ${s.co?esc(fy(s.co)+" "+(s.cot||"")):"—"}</span>
  <span class="amt">${money(a)}</span><span class="type">${esc(payTxt(s,a))}</span>${s.notes?`<span class="type">📝 ${esc(s.notes)}</span>`:""}${delBtn(s)&&`<div class="tools">${delBtn(s)}</div>`}</div>`;
}
function fillList(){
  const{all}=calc(),q=hq.trim().toLowerCase();
  const rows=all.filter(s=>!q||String(s.n).toLowerCase()==q||(s.guest||"").toLowerCase().includes(q)||(s.notes||"").toLowerCase().includes(q));
  $("hlist").innerHTML=rows.length?table([t("hRoom"),t("hGuest"),t("hType"),t("hPeople"),t("cin"),t("cout"),t("hNights"),t("hAmt"),t("payT"),t("hStatus"),t("notes"),...(viewOnly?[]:[""])],rows.slice().reverse().map(s=>[s.n,s.guest||"—",typeL(s),(+s.people||0)+(gdesc(s)?` (${gdesc(s)})`:""),s.ci?fy(s.ci)+" "+(s.cit||""):"—",s.co?fy(s.co)+" "+(s.cot||""):"—",durL(s),s.amount!=null?money(s.amount):"—",payTxt(s,+s.amount||0),s.live?t("inHouse"):t("out"),s.notes||"",...(viewOnly?[]:[{html:delBtn(s)}])])):`<div class="empty" style="margin-top:12px">${t("noHist")}</div>`;
}
const evT=x=>{let m="";if(x.ci==hSel)m=x.cit||"00:00";if(x.co==hSel&&!x.live){const c=x.cot||"00:00";if(c>m)m=c}return m};
function renderHist(){
  const{all}=calc();
  if(hY==null){const n=new Date();hY=n.getFullYear();hM=n.getMonth();hSel=ymd(n)}
  $("hsum").innerHTML=revHtml(1);$("hsum").style.display=ht=="stays"?"":"none";
  $("htabs").innerHTML=[["cal","calT"],["stays","stays"]].map(([k,l])=>`<button class="chip" data-h="${k}" aria-pressed="${ht==k}">${t(l)}</button>`).join("");
  if(ht=="stays"){
    $("hbody").innerHTML=`<input id="hq" type="search" placeholder="${esc(t("search"))}" value="${esc(hq)}" style="margin-top:12px"><div id="hlist"></div>`;fillList();return;
  }
  const first=new Date(hY,hM,1).getDay(),dim=new Date(hY,hM+1,0).getDate(),td=ymd(new Date()),mp=hY+"-"+p2(hM+1);
  let cells=WS[lang].map(x=>`<div class="wd">${x}</div>`).join("");
  for(let i=0;i<first;i++)cells+="<div></div>";
  for(let d=1;d<=dim;d++){
    const D=mp+"-"+p2(d),on=all.filter(x=>onDay(x,D)),rev=tot(on.filter(x=>x.ci==D),x=>x.amount);
    cells+=`<button type="button" class="dy${on.length?" has":" off"}${D==hSel?" sel":""}${D==td?" today":""}" data-d="${D}"><b>${d}</b>${on.length?`<span class="n">${on.length}</span><small>${money(rev)}</small>`:""}</button>`;
  }
  const mrev=tot(all.filter(x=>x.ci&&x.ci.startsWith(mp)),x=>x.amount);
  let det=`<div class="empty" style="margin-top:14px">${t("pickDay")}</div>`;
  if(hSel){
    const on=all.map(x=>({s:x,k:onDay(x,hSel)})).filter(x=>x.k).sort((a,b)=>{const x=evT(a.s),y=evT(b.s);return x==y?byNum(a.s,b.s):(x<y?1:-1)}),R=rcv(all,hSel),sd=pd(hSel);
    det=`<h2 style="margin-top:18px">${WD[lang][sd.getDay()]} · ${fy(hSel)} <small>${on.length} ${t("stayCnt")}</small></h2>
    <div class="bar" style="margin-bottom:0"><div><b>${on.length}</b><span>${t("hRoomsOcc")}</span></div><div><b>${tot(on,x=>x.s.people)}</b><span>${t("hPeople")}</span></div><div><b>${money(tot(on.filter(x=>x.s.ci==hSel),x=>x.s.amount))}</b><span>${t("hRev")}</span></div><div><b>${money(R.cash)}</b><span>${t("hCash")}</span></div><div><b>${money(R.aba)}</b><span>${t("hAba")}</span></div></div>
    ${on.length?`<div class="dg">${on.map(stayCard).join("")}</div>`:`<div class="empty" style="margin-top:10px">${t("dayEmpty")}</div>`}`;
  }
  $("hbody").innerHTML=`<div class="calnav"><button type="button" class="btn ghost" data-hn="-1" aria-label="prev">‹</button><span class="ttl">${MO[lang][hM]} ${hY}</span><button type="button" class="btn ghost" data-hn="1" aria-label="next">›</button><button type="button" class="btn ghost sm" data-hn="0">${t("todayB")}</button><span class="type" style="margin-left:auto">${t("monthRev")}: <b>${money(mrev)}</b></span></div><div class="cal">${cells}</div>${det}`;
}
$("hbtn").onclick=()=>{hY=null;ht="cal";renderHist();$("hdlg").showModal()};
$("hbody").addEventListener("click",e=>{
  const dl=e.target.closest("[data-del]");if(dl){delHist(dl.dataset.del);return}
  const d=e.target.closest("[data-d]");if(d){hSel=d.dataset.d;renderHist();return}
  const n=e.target.closest("[data-hn]");if(!n)return;const v=+n.dataset.hn;
  if(v==0){hY=null}else{hM+=v;if(hM<0){hM=11;hY--}else if(hM>11){hM=0;hY++}}
  renderHist();
});
$("hbody").addEventListener("input",e=>{if(e.target.id=="hq"){hq=e.target.value;fillList()}});
$("htabs").onclick=e=>{const b=e.target.closest("[data-h]");if(b){ht=b.dataset.h;renderHist()}};
$("hx").onclick=()=>$("hdlg").close();
$("hdlg").addEventListener("click",e=>{if(e.target==$("hdlg"))$("hdlg").close()});

$("xl").onclick=async()=>{
  if(!window.XLSX){alert(t("noXlsx"));return}
  let dl=null;try{dl=await claude.use("downloads")}catch(e){}
  const now=new Date(),{all,days}=calc();
  const g=[[t("hRoom"),t("hBeds"),t("hCool"),t("hType"),t("hGuest"),t("hPeople"),t("men"),t("women"),t("kids"),t("cinD"),t("cinT"),t("coD"),t("coT"),t("hNights"),t("hHours"),t("hAmt"),t("hStatus"),t("notes"),t("hPrepA"),t("hPrepM"),t("hBalA"),t("hBalM")]];
  all.forEach(s=>g.push([s.n,s.beds,s.cool?(s.cool=="ac"?t("ac"):t("fan")):"",typeL(s),s.guest,+s.people||0,+s.m||0,+s.w||0,+s.c||0,s.ci,s.cit,s.co,s.cot,s.mode=="hour"?0:(s.ci?nightsB(s):0),s.mode=="hour"?(s.hrs||hh()):0,+s.amount||0,s.live?t("inHouse"):t("out"),s.notes||"",+s.paid||0,mName(s.pm),bal(s),mName(s.pmOut)]));
  const trow=Array(22).fill("");trow[14]=t("sumL");trow[15]=tot(all,s=>s.amount);g.push(trow);
  const dd=[[t("hDate"),t("hRoomsOcc"),t("hPeople"),t("hInR"),t("hInP"),t("hRev"),t("hInT"),t("hOutT")],...days.map(d=>dayRow(d,"; "))];
  const mm={},mk=k=>mm[k]=mm[k]||{c:0,p:0,rn:0,rev:0,cash:0,aba:0};
  days.forEach(d=>{mk(d.k.slice(0,7)).rn+=d.r});
  all.filter(s=>s.ci).forEach(s=>{const x=mk(s.ci.slice(0,7));x.c++;x.p+=+s.people||0;x.rev+=+s.amount||0});
  all.forEach(s=>{const a=+s.amount||0,p=+s.paid||0;if(p>0&&s.pm&&s.ci)mk(s.ci.slice(0,7))[s.pm]+=p;if(!s.live&&s.pmOut&&s.co)mk(s.co.slice(0,7))[s.pmOut]+=a-p});
  const mo=[[t("hMonth"),t("hCheckins"),t("hPeopleCI"),t("hRoomNights"),t("hAvg"),t("hRev"),t("hCash"),t("hAba")]];
  Object.keys(mm).sort().forEach(k=>{const[y,m]=k.split("-"),x=mm[k],n=new Date(+y,+m,0).getDate();mo.push([k,x.c,x.p,x.rn,Math.round(x.rn/n*10)/10,x.rev,x.cash,x.aba])});
  const wb=XLSX.utils.book_new();
  [[g,t("shG"),[8,6,14,14,20,10,8,8,8,12,10,12,10,8,8,12,14,40,14,14,16,16]],[dd,t("shD"),[14,18,14,16,16,14,60,60]],[mo,t("shM"),[10,16,18,16,22,14,14,14]]].forEach(([rows,name,w])=>{
    const ws=XLSX.utils.aoa_to_sheet(rows);ws["!cols"]=w.map(x=>({wch:x}));XLSX.utils.book_append_sheet(wb,ws,name);
  });
  const buf=XLSX.write(wb,{type:"array",bookType:"xlsx"});
  const fn="guesthouse-log-"+ymd(now)+".xlsx";try{if(dl)await dl.save({filename:fn,data:new Blob([buf])});else XLSX.writeFile(wb,fn)}
  catch(e){if(e&&e.code!="declined")alert(t("saveFail"))}
};
let netS=useDb?"wait":"local";
function net(s){netS=s;$("net").textContent=s=="on"?"● "+t("netOn"):s=="err"?"⚠ "+t("netErr"):s=="local"?"⚠ "+t("netLocal"):t("netWait")}
async function pull(){
  if(busy||Date.now()-lastSave<2500)return;
  try{
    const d=await rpc("gh_load",{p_code:CODE});
    if(busy||Date.now()-lastSave<2500)return;
    if(!loaded&&!d.rooms.length){rooms=seed();loaded=true;net("on");render();save();return}
    const sig=JSON.stringify(d);if(loaded&&sig===lastSig){net("on");return}lastSig=sig;
    rooms=d.rooms.sort(byNum);hist=d.hist;if(d.prices)prices={...DEF,...d.prices};
    synced.rooms={};rooms.forEach(r=>synced.rooms[r.id]=JSON.stringify(r));
    synced.hist={};hist.forEach(h=>synced.hist[h.id]=1);synced.prices=JSON.stringify(prices);
    loaded=true;net("on");
    if(capFix())save();
    document.querySelectorAll("[data-p]").forEach(i=>{if(document.activeElement!==i)i.value=prices[i.dataset.p]});qrPrev();
    render();if($("hdlg").open)renderHist();
  }catch(e){net("err")}
}
function startDb(c){CODE=c;pull();setInterval(pull,4000)}
$("lock").addEventListener("cancel",e=>e.preventDefault());
$("lf").onsubmit=e=>{
  e.preventDefault();const c=$("code").value.toLowerCase().replace(/[^a-z0-9]/g,"");
  if(c.length<8){$("cerr").textContent=t("codeBad");return}
  try{localStorage.setItem(CKEY,c)}catch(x){}
  $("lock").close();startDb(c);
};
$("chg").style.display=useDb?"":"none";
$("chg").onclick=()=>{try{localStorage.removeItem(CKEY)}catch(e){}location.reload()};
rooms.sort(byNum);applyLang();qrPrev();
if(useDb){let c="";try{c=localStorage.getItem(CKEY)||""}catch(e){}c.length>=8?startDb(c):$("lock").showModal()}
</script>
